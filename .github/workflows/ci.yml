name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kit-tests:
    name: ZettairKit unit tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Run package tests
        working-directory: ZettairKit
        run: swift test

  xcode-build:
    name: Xcode build (Debug, iOS simulator)
    runs-on: macos-15
    needs: kit-tests
    steps:
      - uses: actions/checkout@v5
      # Xcode 16 is required because xcodegen 2.45 emits project files at
      # objectVersion 77, which Xcode 15 can't read. macos-15 runners
      # ship multiple Xcodes; pin to Xcode 16 explicitly so the build is
      # deterministic.
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build app target
        # generic/platform=iOS (device) instead of iOS Simulator — the
        # runner's iphonesimulator SDK doesn't have matching simulator
        # runtimes installed, so a simulator build errors out at the
        # asset compilation step. A device build is enough to confirm
        # the project + Swift sources compile cleanly. CODE_SIGNING_ALLOWED=NO
        # skips the per-target signing dance.
        run: |
          xcodebuild \
            -project Zettair.xcodeproj \
            -scheme ZettairApp \
            -configuration Debug \
            -destination "generic/platform=iOS" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            build
