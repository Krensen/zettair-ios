# XcodeGen descriptor — run `xcodegen` to regenerate Zettair.xcodeproj.
# https://github.com/yonaskolb/XcodeGen
name: Zettair
options:
  bundleIdPrefix: io.zettair
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"     # iPhone + iPad
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    GENERATE_INFOPLIST_FILE: YES

packages:
  ZettairKit:
    path: ZettairKit

targets:

  # ---------------- Main app ----------------
  ZettairApp:
    type: application
    platform: iOS
    sources:
      - path: ZettairApp
    resources:
      - path: ZettairApp/Resources
        optional: true
    dependencies:
      - package: ZettairKit
      - target: ZettairWidget
        embed: true
      - target: ZettairShare
        embed: true
      - target: ZettairIntents
        embed: true
    info:
      path: ZettairApp/Info.plist
      properties:
        CFBundleDisplayName: Zettair
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: io.zettair.app
            CFBundleURLSchemes:
              - zettair
        UIBackgroundModes: []
        NSUserActivityTypes:
          - io.zettair.app.search
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zettair.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: ZettairApp/ZettairApp.entitlements
        CODE_SIGN_STYLE: Automatic

  # ---------------- Widget extension ----------------
  ZettairWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ZettairWidget
    dependencies:
      - package: ZettairKit
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: ZettairWidget/Info.plist
      properties:
        CFBundleDisplayName: Zettair Trending
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zettair.app.widget
        CODE_SIGN_ENTITLEMENTS: ZettairWidget/ZettairWidget.entitlements
        CODE_SIGN_STYLE: Automatic

  # ---------------- Share extension ----------------
  ZettairShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ZettairShare
    info:
      path: ZettairShare/Info.plist
      properties:
        CFBundleDisplayName: Search Zettair
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zettair.app.share
        CODE_SIGN_ENTITLEMENTS: ZettairShare/ZettairShare.entitlements
        CODE_SIGN_STYLE: Automatic

  # ---------------- Intents extension ----------------
  ZettairIntents:
    type: app-extension
    platform: iOS
    sources:
      - path: ZettairIntents
    dependencies:
      - package: ZettairKit
    info:
      path: ZettairIntents/Info.plist
      properties:
        CFBundleDisplayName: Zettair
        NSExtension:
          NSExtensionPointIdentifier: com.apple.appintents-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.zettair.app.intents
        CODE_SIGN_ENTITLEMENTS: ZettairIntents/ZettairIntents.entitlements
        CODE_SIGN_STYLE: Automatic

schemes:
  ZettairApp:
    build:
      targets:
        ZettairApp: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
